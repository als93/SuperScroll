<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gadget Garden – SuperScroll demo</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--mute:#6b7280;--acc:#4f46e5}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#111827;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:5;
    display:flex;justify-content:space-between;align-items:center}
  header b{font-size:18px}
  header span{color:#9ca3af;font-size:13px}
  .tabs{display:flex;gap:8px}
  .tabs a{color:#fff;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:999px;background:#374151}
  .tabs a.on{background:var(--acc)}
  main{max-width:1000px;margin:24px auto;padding:0 16px}
  h1{margin:0 0 4px;font-size:24px}
  .sub{color:var(--mute);margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .item{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);
    animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  .thumb{height:110px;display:grid;place-items:center;font-size:44px}
  .body{padding:10px 12px 12px}
  .name{font-weight:600}
  .price{color:var(--acc);font-weight:700;margin-top:2px}
  .meta{color:var(--mute);font-size:12px}
  .foot{text-align:center;padding:28px 0 60px}
  button.more{font:600 15px system-ui;padding:12px 28px;border:0;border-radius:999px;
    background:var(--acc);color:#fff;cursor:pointer}
  button.more:hover{background:#4338ca}
  .end{color:var(--mute)}
  .spin{display:none;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div><b>🌱 Gadget Garden</b> <span>SuperScroll test page</span></div>
  <div class="tabs">
    <a id="tabBtn" href="?mode=button">“Load more” button</a>
    <a id="tabInf" href="?mode=scroll">Infinite scroll</a>
  </div>
</header>
<main>
  <h1>All gadgets</h1>
  <p class="sub" id="count">Showing 0 of 240 results</p>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <button class="more" id="more">Load more</button>
    <div class="spin" id="spin">Loading…</div>
    <div class="end" id="end" hidden>✔ You’ve reached the end — 240 results</div>
  </div>
  <div id="sentinel"></div>
</main>

<script>
const TOTAL = 240, PAGE = 24;
const emojis = ["⌚","🎧","📷","🖱️","⌨️","🔋","💡","🎮","📱","🔌","🖨️","📺"];
const colors = ["#e0e7ff","#d1fae5","#fef3c7","#fee2e2","#ede9fe","#cffafe"];
const adj = ["Smart","Compact","Pro","Ultra","Eco","Turbo","Nano","Classic"];
const noun = ["Watch","Headphones","Camera","Mouse","Keyboard","Charger","Lamp","Console","Phone","Hub","Printer","Display"];
let shown = 0, busy = false;
const mode = new URLSearchParams(location.search).get("mode") === "scroll" ? "scroll" : "button";
document.getElementById(mode === "scroll" ? "tabInf" : "tabBtn").classList.add("on");

const $ = (id) => document.getElementById(id);

function render(n) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++, shown++) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<div class="thumb" style="background:${colors[shown % colors.length]}">${emojis[shown % emojis.length]}</div>
      <div class="body"><div class="name">${adj[shown % adj.length]} ${noun[shown % noun.length]} #${shown + 1}</div>
      <div class="price">$${(9 + (shown * 7) % 190).toFixed(2)}</div><div class="meta">In stock · Free shipping</div></div>`;
    frag.appendChild(el);
  }
  $("grid").appendChild(frag);
  $("count").textContent = `Showing ${shown} of ${TOTAL} results`;
}

function loadNext() {
  if (busy || shown >= TOTAL) return;
  busy = true; $("spin").style.display = "block";
  if (mode === "button") $("more").style.visibility = "hidden";
  setTimeout(() => {          // fake network delay
    render(Math.min(PAGE, TOTAL - shown));
    busy = false; $("spin").style.display = "none";
    if (shown >= TOTAL) { $("more").remove(); $("end").hidden = false; }
    else if (mode === "button") $("more").style.visibility = "visible";
  }, 500);
}

render(PAGE);
if (mode === "button") {
  $("more").addEventListener("click", loadNext);
} else {
  $("more").remove();
  new IntersectionObserver((e) => e[0].isIntersecting && loadNext(), { rootMargin: "100px" })
    .observe($("sentinel"));
}
</script>
</body>
</html>
